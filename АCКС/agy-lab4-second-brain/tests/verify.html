    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderMarkdown(text) {
      if (!text) return "";
      let html = escapeHtml(text);

      // Виправлення багу апострофа: нормалізуємо сутності &#039; та &apos; назад в одинарний апостроф
      html = html.replace(/\[\[(.*?)(?:\|(.*?))?\]\]/g, (match, title, alias) => {
        const cleanTitle = title.replace(/&#039;|&apos;/g, "'").trim();
        const displayText = alias ? alias.replace(/&#039;|&apos;/g, "'").trim() : cleanTitle;
        return `<a href="#" class="wikilink" data-target="${escapeHtml(cleanTitle)}">[[${escapeHtml(displayText)}]]</a>`;
      });

      html = html.replace(/^### (.*$)/gim, "<h3>$1</h3>");
      html = html.replace(/^## (.*$)/gim, "<h2>$1</h2>");
      html = html.replace(/^# (.*$)/gim, "<h1>$1</h1>");
      html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/^\- (.*$)/gim, "<li>$1</li>");
      html = html.replace(/(<li>.*<\/li>)/gims, "<ul>$1</ul>");
      html = html.replace(/<\/ul>\s*<ul>/g, "");
      html = html.replace(/\$\$([\s\S]*?)\$\$/g, "<div class='math-display'><code>$1</code></div>");
      html = html.replace(/\$([^\$]+)\$/g, "<code class='math-inline'>$1</code>");

      const paragraphs = html.split(/\n\n+/);
      return paragraphs.map(p => {
        p = p.trim();
        if (!p) return "";
        if (p.startsWith("<h") || p.startsWith("<ul") || p.startsWith("<pre") || p.startsWith("<div")) {
          return p;
        }
        return `<p>${p.replace(/\n/g, "<br>")}</p>`;
      }).join("\n");
    }

    function parseMarkdownFile(rawContent, filename, relativePath = "") {
      let category = "Inbox";
      if (relativePath) {
        const match = relativePath.match(/(?:notes[/\\])?(Inbox|Projects|Areas|Resources|Archives)/i);
        if (match) {
          const found = match[1].toLowerCase();
          category = found.charAt(0).toUpperCase() + found.slice(1);
        }
      }

      const frontmatterRegex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/;
      const match = rawContent.match(frontmatterRegex);

      let metadata = {};
      let content = rawContent;

      if (match) {
        const yamlBlock = match[1];
        content = match[2].trim();

        const lines = yamlBlock.split("\n");
        let currentArrayKey = null;

        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith("#")) return;

          if (trimmed.startsWith("- ") && currentArrayKey) {
            const val = trimmed.substring(2).trim().replace(/^['"]|['"]$/g, "");
            if (!Array.isArray(metadata[currentArrayKey])) metadata[currentArrayKey] = [];
            metadata[currentArrayKey].push(val);
            return;
          }

          const colonIdx = trimmed.indexOf(":");
          if (colonIdx > 0) {
            const key = trimmed.substring(0, colonIdx).trim();
            let value = trimmed.substring(colonIdx + 1).trim();

            if (value === "") {
              currentArrayKey = key;
              metadata[key] = [];
            } else {
              currentArrayKey = null;
              if (value.startsWith("[") && value.endsWith("]")) {
                metadata[key] = value.slice(1, -1).split(",").map(s => s.trim().replace(/^['"]|['"]$/g, ""));
              } else {
                metadata[key] = value.replace(/^['"]|['"]$/g, "");
              }
            }
          }
        });
      }

      if (metadata.category) {
        const cat = metadata.category.toLowerCase();
        const valid = ["inbox", "projects", "areas", "resources", "archives"];
        if (valid.includes(cat)) {
          category = cat.charAt(0).toUpperCase() + cat.slice(1);
        }
      } else if (category === "Inbox" && metadata.type) {
        const t = metadata.type.toLowerCase();
        if (t === "project") category = "Projects";
        else if (t === "area" || t === "moc") category = "Areas";
        else if (t === "resource") category = "Resources";
        else if (t === "archive") category = "Archives";
      }

      const defaultTitle = filename.replace(/\.(md|markdown)$/i, "");
      const title = metadata.title || defaultTitle;
      const now = new Date().toISOString().replace("T", " ").substring(0, 19);

      return {
        id: "note-" + Math.random().toString(36).substr(2, 9),
        filename: filename,
        category: category,
        title: title,
        created: metadata.created || now,
        updated: metadata.updated || now,
        tags: Array.isArray(metadata.tags) ? metadata.tags : (metadata.tags ? [metadata.tags] : []),
        status: metadata.status || "active",
        type: metadata.type || "resource",
        source: metadata.source || "імпортовано з диска",
        content: content
      };
    }

    function filterNotes(notes, category = "ALL", activeTag = null, searchQuery = "") {
      const q = searchQuery.trim().toLowerCase();
      return notes.filter(note => {
        if (category !== "ALL" && note.category !== category) return false;
        if (activeTag && (!note.tags || !note.tags.includes(activeTag))) return false;
        if (q) {
          const titleMatch = note.title.toLowerCase().includes(q);
          const contentMatch = (note.content || "").toLowerCase().includes(q);
          const tagsMatch = (note.tags || []).some(t => t.toLowerCase().includes(q));
          const sourceMatch = (note.source || "").toLowerCase().includes(q);
          return titleMatch || contentMatch || tagsMatch || sourceMatch;
        }
        return true;
      });
    }

    function resolveWikilink(notes, targetTitle) {
      if (!targetTitle) return null;
      const cleanTarget = targetTitle.replace(/&#039;|&apos;/g, "'").replace(/[’`]/g, "'").trim().toLowerCase();
      return notes.find(n => {
        const noteTitle = n.title.replace(/&#039;|&apos;/g, "'").replace(/[’`]/g, "'").trim().toLowerCase();
        return noteTitle === cleanTarget;
      });
    }

    function getBacklinks(notes, currentTitle) {
      const cleanTitle = currentTitle.replace(/&#039;|&apos;/g, "'").replace(/[’`]/g, "'").trim();
      const escapedTitle = cleanTitle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const pattern = new RegExp(`\\[\\[${escapedTitle}(\\|.*?)?\\]\\]`, "i");

      return notes.filter(n => {
        if (n.title.toLowerCase() === currentTitle.toLowerCase()) return false;
        return pattern.test(n.content || "");
      });
    }

    // ==========================================
    // 3. АВТОНОМНИЙ ТЕСТ-РАННЕР

    class AutonomousTestRunner {
      constructor() {
        this.suites = [];
        this.total = 0;
        this.passed = 0;
        this.failed = 0;
      }

      suite(name, fn) {
        const suiteObj = { name, cases: [], passed: true };
        this.suites.push(suiteObj);
        
        const assert = (name, condition, detail = "") => {
          this.total++;
          const isPass = Boolean(condition);
          if (isPass) this.passed++;
          else {
            this.failed++;
            suiteObj.passed = false;
          }
          suiteObj.cases.push({ name, passed: isPass, detail });
        };

        try {
          fn(assert);
        } catch (err) {
          assert("Критична помилка виконання сюїти", false, err.message);
        }
      }

      run() {
        const startTime = performance.now();
        this.suites = [];
        this.total = 0;
        this.passed = 0;
        this.failed = 0;

        const notes = TEST_NOTES;

        this.suite("1. Парсинг YAML Frontmatter та структури нотатки", (assert) => {
          const sampleRaw = `---

- [[MOC - Комп'ютерні системи, Хмари та Штучний Інтелект]]`;

          const parsed = parseMarkdownFile(sampleRaw, "Тестова нотатка для перевірки.md", "notes/Resources/file.md");

          assert("Витягування поля 'title'", parsed.title === "Тестова нотатка для перевірки", `title: "${parsed.title}"`);
          assert("Витягування дати 'created'", parsed.created === "2026-11-16 12:00:00", `created: "${parsed.created}"`);
          assert("Парсинг масиву тегів 'tags'", Array.isArray(parsed.tags) && parsed.tags.includes("парсинг"), `tags: [${parsed.tags.join(", ")}]`);
          assert("Визначення категорії з шляху (Resources)", parsed.category === "Resources", `category: "${parsed.category}"`);
          assert("Витягування джерела 'source'", parsed.source === "специфікація lab4", `source: "${parsed.source}"`);
          assert("Відокремлення контенту від Frontmatter", !parsed.content.startsWith("---") && parsed.content.includes("## Короткий зміст"), "Frontmatter коректно відтятий");
        });

        // 2. Тест повнотекстового пошуку за словом
        this.suite("2. Повнотекстовий пошук за ключовими словами", (assert) => {
          const resKubernetes = filterNotes(notes, "ALL", null, "kubernetes");
          assert("Пошук за словом 'kubernetes' у назві/тексті", resKubernetes.length > 0 && resKubernetes.some(n => n.title.includes("Kubernetes")), `Знайдено: ${resKubernetes.length} нотаток`);

          const resCgroups = filterNotes(notes, "ALL", null, "cgroups");
          assert("Пошук за терміном у середині контенту ('cgroups')", resCgroups.length > 0 && resCgroups.some(n => n.content.includes("cgroups")), `Знайдено: ${resCgroups.length} нотаток`);

          const resOllama = filterNotes(notes, "ALL", null, "OLLAMA");
          assert("Регістронезалежний пошук ('OLLAMA' знаходить 'Ollama')", resOllama.length > 0 && resOllama.some(n => n.title.includes("Ollama")), `Знайдено: ${resOllama.length} нотаток`);

          const resTag = filterNotes(notes, "ALL", null, "mesi");
          assert("Пошук за назвою тегу ('mesi')", resTag.length > 0 && resTag.some(n => n.tags.includes("mesi")), `Знайдено: ${resTag.length} нотаток`);
        });

        // 3. Тест фільтрації за категоріями PARA
        this.suite("3. Фільтрація за категоріями PARA", (assert) => {
          const inboxNotes = filterNotes(notes, "Inbox");
          assert("Фільтрація категорії 'Inbox' (1 нотатка)", inboxNotes.length === 1 && inboxNotes[0].category === "Inbox", `Отримано: ${inboxNotes.length}`);

          const projNotes = filterNotes(notes, "Projects");
          assert("Фільтрація категорії 'Projects' (1 нотатка)", projNotes.length === 1 && projNotes[0].category === "Projects", `Отримано: ${projNotes.length}`);

          const areaNotes = filterNotes(notes, "Areas");
          assert("Фільтрація категорії 'Areas' (1 нотатка - MOC)", areaNotes.length === 1 && areaNotes[0].category === "Areas", `Отримано: ${areaNotes.length}`);

          const resNotes = filterNotes(notes, "Resources");
          assert("Фільтрація категорії 'Resources' (4 нотатки)", resNotes.length === 4 && resNotes.every(n => n.category === "Resources"), `Отримано: ${resNotes.length}`);

          const archNotes = filterNotes(notes, "Archives");
          assert("Фільтрація категорії 'Archives' (1 нотатка)", archNotes.length === 1 && archNotes[0].category === "Archives", `Отримано: ${archNotes.length}`);

          const allNotes = filterNotes(notes, "ALL");
          assert("Категорія 'ALL' повертає всі 8 нотаток", allNotes.length === 8, `Всього: ${allNotes.length}`);
        });

        // 4. Тест фільтрації за тегами
        this.suite("4. Фільтрація за тегами", (assert) => {
          const aiNotes = filterNotes(notes, "ALL", "штучний-інтелект");
          assert("Фільтр за тегом '#штучний-інтелект' (3 нотатки)", aiNotes.length === 3 && aiNotes.every(n => n.tags.includes("штучний-інтелект")), `Знайдено: ${aiNotes.length}`);

          const archNotes = filterNotes(notes, "ALL", "архітектура");
          assert("Фільтр за тегом '#архітектура' (2 нотатки)", archNotes.length === 2 && archNotes.every(n => n.tags.includes("архітектура")), `Знайдено: ${archNotes.length}`);

          const resetNotes = filterNotes(notes, "ALL", null);
          assert("Скидання активного тегу повертає повну базу (8 нотаток)", resetNotes.length === 8, `Отримано: ${resetNotes.length}`);
        });

        // 5. Тест внутрішніх посилань [[...]] та апострофа
        this.suite("5. Резолюція внутрішніх посилань [[...]] та обробка апострофа", (assert) => {
          const rawWithApostrophe = "Перехід до [[MOC - Комп'ютерні системи, Хмари та Штучний Інтелект]]";
          const renderedHtml = renderMarkdown(rawWithApostrophe);

          assert(
            "Апостроф у назві не перетворюється на HTML-сутність &#039;",
            !renderedHtml.includes("&#039;") && renderedHtml.includes("MOC - Комп'ютерні системи, Хмари та Штучний Інтелект"),
            `Отриманий HTML: ${renderedHtml}`
          );

          assert(
            "Генерація коректного клікабельного лінка wikilink з чистим data-target",
            renderedHtml.includes('class="wikilink"') && renderedHtml.includes('data-target="MOC - Комп\'ютерні системи, Хмари та Штучний Інтелект"'),
            "Атрибут data-target містить чисту назву з апострофом"
          );

          // Тест резолюції цільової нотатки за посиланням
          const targetTitle = "Контейнеризація та мікросервісна архітектура";
          const resolvedNote = resolveWikilink(notes, targetTitle);
          assert(
            "Успішна резолюція цільової нотатки за точною назвою",
            resolvedNote !== null && resolvedNote.title === targetTitle,
            `Знайдена нотатка: "${resolvedNote ? resolvedNote.title : 'null'}"`
          );

          // Тест резолюції MOC з апострофом
          const mocResolved = resolveWikilink(notes, "MOC - Комп'ютерні системи, Хмари та Штучний Інтелект");
          assert(
            "Успішна резолюція MOC-нотатки з українським апострофом",
            mocResolved !== null && mocResolved.category === "Areas",
            `Категорія знайденої MOC: "${mocResolved ? mocResolved.category : 'null'}"`
          );

          // Тест розрахунку Backlinks
          const backlinksForContainers = getBacklinks(notes, "Контейнеризація та мікросервісна архітектура");
          assert(
            "Розрахунок зворотних посилань (Backlinks) для контейнеризації",
            backlinksForContainers.length >= 3,
            `Знайдено ${backlinksForContainers.length} зворотних посилань (MOC, K8s, AWS, Namespaces)`
          );
        });

        // 6. Тест обробки порожнього пошуку (Empty State)
        this.suite("6. Обробка порожнього пошуку та стану Empty State", (assert) => {
          const query = "qwerty_неіснуюче_слово_999";
          const emptyResults = filterNotes(notes, "ALL", null, query);

          assert("Пошук неіснуючого слова повертає 0 результатів", emptyResults.length === 0, `Знайдено: ${emptyResults.length}`);

          // Генерація тексту повідомлення Empty State
          const emptyMessage = emptyResults.length === 0 
            ? `За запитом "${query}" не знайдено жодної нотатки. Спробуйте змінити пошукове слово або скиньте фільтри.`
            : "Знайдено результати";

          assert("Формування коректного тексту повідомлення для Empty State", emptyMessage.includes(query) && emptyMessage.includes("не знайдено жодної нотатки"), `Повідомлення: "${emptyMessage}"`);
        });

        const duration = Math.round(performance.now() - startTime);
        this.renderResults(duration);
      }

      renderResults(duration) {
        document.getElementById("totalTestsCount").textContent = this.total;
        document.getElementById("passedTestsCount").textContent = this.passed;
        const failedEl = document.getElementById("failedTestsCount");
        failedEl.textContent = this.failed;
        failedEl.className = `metric-value ${this.failed > 0 ? "danger" : ""}`;
        document.getElementById("executionTime").textContent = `${duration} ms`;

        const container = document.getElementById("suitesContainer");
        container.innerHTML = "";

        this.suites.forEach(suite => {
          const card = document.createElement("div");
          card.className = "suite-card";

          const header = document.createElement("div");
          header.className = "suite-header";
          header.innerHTML = `
            <div class="suite-title">
              <span>${suite.passed ? "✅" : "❌"}</span>
              <h3>${suite.name}</h3>
            </div>
            <span class="badge ${suite.passed ? "badge-pass" : "badge-fail"}">
              ${suite.passed ? "Пройдено" : "Помилка"}
            </span>
          `;
          card.appendChild(header);

          const list = document.createElement("div");
          list.className = "test-cases";

          suite.cases.forEach(c => {
            const row = document.createElement("div");
            row.className = "test-row";
            row.innerHTML = `
              <div class="test-desc">
                <span class="test-name">${c.passed ? "✓" : "✗"} ${c.name}</span>
                ${c.detail ? `<span class="test-detail">${c.detail}</span>` : ""}
              </div>
              <span class="test-status ${c.passed ? "status-pass" : "status-fail"}">
                ${c.passed ? "PASS" : "FAIL"}
              </span>
            `;
            list.appendChild(row);
          });

          card.appendChild(list);
          container.appendChild(card);
        });
      }
    }

    // Миттєвий запуск та обробка кнопки
    function startRunner() {
      const runner = new AutonomousTestRunner();
      runner.run();

      const btn = document.getElementById("runTestsBtn");
      if (btn) {
        btn.onclick = () => runner.run();
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", startRunner);
    } else {
      startRunner();
    }
  </script>
