name: JS CI Workflow

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Build and Test (POSIX)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./scripts/ci.sh
          ./scripts/ci.sh

      - name: Run Build and Test (Windows)
        if: runner.os == 'Windows'
        run: |
          .\scripts\ci.bat
